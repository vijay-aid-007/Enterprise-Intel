[project]
name = "enterprise-intel"
version = "0.1.0"
description = "Churn prediction, cited document Q&A (RAG), a tool-using agent and retention reports on the Telco churn dataset"
readme = "README.md"
authors = [
    { name = "vijay-aid-007", email = "vijayjoka25@gmail.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.162.0",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "joblib>=1.6.0",
    "numpy",
    "pandas>=3.1.0",
    "pdfplumber>=0.11.10",
    "pydantic>=2.14.1",
    "python-docx>=1.2.0",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.2",
    "sentence-transformers>=6.2.0",
    "shap>=0.51.0",
    "streamlit>=1.66.1",
    "uvicorn>=0.54.0",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "reportlab>=5.1.0"]  # reportlab: tests/test_docs_smoke.py builds test PDFs; scripts/make_synthetic_docs.py also uses it